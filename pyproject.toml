[project]
name = "trading"
version = "1.0.0"
requires-python = ">=3.12"
description = "Neural network-based stock trading system using evolutionary algorithms."

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E266",   # Unicode box-drawing section dividers (deliberate style)
    "E501",   # line-length handled by line-length=120; 3 log-format lines get # noqa
    "E701",   # `if x: y` one-liners — deliberate style in scoring/fill-simulation hot paths
    "E702",   # `a = 1; b = 2` one-liners — same; keeps related assignments on one visual line
    "SIM108", # ternary rewrites hurt readability in fill-simulation logic
    "SIM103", # `if cond: return True / return False` — the explicit branches carry per-case
              # comments (see plot_training._is_reset: pre-fix sentinel vs post-fix triple)
    "B007",   # unused loop variable false positives on range() loops
]

[tool.ruff.lint.isort]
known-third-party = ["torch", "yfinance", "alpaca", "keyring", "numpy"]
